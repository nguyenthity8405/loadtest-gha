# Runs the bash loadtest on every push. The 5-minute Fly cron
# (scripts/gha-trigger.sh) pushes a `tmp` commit to fire it; workflow_dispatch
# allows a manual run. 5 is replaced with LOADTEST_RPS from
# deploy.env by scripts/gha-repo-sync.sh when this file is mirrored into the
# runner repo — RPS has exactly one source of truth.
name: loadtest

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loadtest
  cancel-in-progress: false

jobs:
  loadtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LOADTEST_RPS: "5"
      LOADTEST_DURATION_SECS: "120"
    steps:
      - uses: actions/checkout@v4
      - run: bash ./loadtest.sh
