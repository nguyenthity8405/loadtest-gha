# Runs the Node loadtest on every push to main or trigger. The 5-minute Fly
# cron (scripts/gha-trigger.sh) pushes a `tmp` commit to fire it;
# workflow_dispatch allows a manual run. The RPS placeholder in the env below
# is replaced with LOADTEST_RPS from deploy.env by scripts/gha-repo-sync.sh
# when this file is mirrored into the runner repo — RPS has exactly one
# source of truth. (Job-level retention-days was tried here and GitHub
# rejected the whole workflow with no jobs created — keep this file to the
# proven key set.)
name: loadtest

on:
  push:
    branches: [main, trigger]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loadtest
  cancel-in-progress: false

jobs:
  loadtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LOADTEST_RPS: "10"
      LOADTEST_DURATION_SECS: "120"
      LOADTEST_MIN_RPS_PERCENT: "35"
      # Token leg: acquire ONE player token from the broker (mint-first, so the
      # runner never mints from GitHub egress) and drive the apig read-data
      # APIs with it. The URL is public; the secret is a GitHub Actions secret
      # (never in this file, never in the repo) injected at run time.
      LOADTEST_TOKEN_URL: "https://tokenbroker.fly.dev/token"
      LOADTEST_BROKER_SECRET: "${{ secrets.GHA_BROKER_SECRET }}"
    steps:
      - uses: actions/checkout@v4
      - run: node ./loadtest.mjs
      # Keep every run's raw results so runs can be compared over time.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadtest-results
          path: loadtest-results.tsv
          if-no-files-found: ignore
          retention-days: 5
